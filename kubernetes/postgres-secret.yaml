apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: database
type: Opaque
stringData:
  username: airflow
  password: airflow_secure_password_change_me
  database: airflow
  # Full connection string
  db-url: postgresql://airflow:airflow_secure_password_change_me@mlpipeline-postgresql:5432/airflow
---
# Keycloak OAuth secrets
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-serving-secret
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  client-id: mlpipeline-serving
  client-secret: 1xW9rvftoYfkdndAWnMxYFPGUsNASDAQ
# keycloak-airflow-secret is intentionally NOT managed here. Its real
# client-secret is set directly on the cluster to match whatever Keycloak
# has configured for the airflow-webserver client (the placeholder value
# this manifest used to carry was being re-applied by every ArgoCD sync,
# since Kubernetes always merges a Secret's stringData into data server-side
# regardless of ArgoCD's ignoreDifferences). The live object is annotated
# argocd.argoproj.io/sync-options: Prune=false so removing it here doesn't
# delete it.
