apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlpipeline-ingress
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: "reunion-letsencrypt"
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.mlpipeline.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://mlpipeline.duckdns.org/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mlpipeline.duckdns.org
      secretName: mlpipeline-tls
  rules:
    - host: mlpipeline.duckdns.org
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mlpipeline-backend-178
                port:
                  number: 80
---
# Unauthenticated ingress for health check only
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlpipeline-ingress-public
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: "reunion-letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mlpipeline.duckdns.org
      secretName: mlpipeline-tls
  rules:
    - host: mlpipeline.duckdns.org
      http:
        paths:
          - path: /airflow
            pathType: Prefix
            backend:
              service:
                name: mlpipeline-backend-178
                port:
                  number: 80
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
          - path: /health
            pathType: Exact
            backend:
              service:
                name: mlpipeline-backend-178
                port:
                  number: 80
---
# Backend on the Zephyrus kind cluster, reached through the rag-forward relay
# (192.168.1.178:18000 -> kind ingress-nginx NodePort 30717). That ingress
# routes /airflow to the webserver and everything else to serving; see
# kubernetes/zephyrus/ingress.yaml. Same pattern as rag/rag-frontend-176.
apiVersion: v1
kind: Service
metadata:
  name: mlpipeline-backend-178
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
spec:
  ports:
    - name: http
      port: 80
      targetPort: 18000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mlpipeline-backend-178
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
subsets:
  - addresses:
      - ip: 192.168.1.178
    ports:
      - name: http
        port: 18000
