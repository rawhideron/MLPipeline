# Backend routing on the Zephyrus kind cluster, synced only by
# mlpipeline-backend-178. Envoy Gateway's backup-gateway (NodePort 30718)
# replaced ingress-nginx here (goodman_reunion #764); 230 reaches it through
# rag-forward's :18000 relay, with TLS, auth and the /api rewrite already
# done. Fields the API server would default are written out so ArgoCD
# doesn't report it OutOfSync.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlpipeline-backend
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: backup-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - mlpipeline.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /airflow
      backendRefs:
        - group: ""
          kind: Service
          name: airflow-webserver
          port: 8080
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mlpipeline-serving
          port: 8000
          weight: 1
      timeouts:
        request: 0s
---
# nginx's proxy-read-timeout 3600. timeouts.request 0s (no total cap) makes
# Envoy Gateway disable the route's idle timeout, so set it explicitly.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mlpipeline-backend-idle-timeout
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mlpipeline-backend
  timeout:
    http:
      streamIdleTimeout: 1h
