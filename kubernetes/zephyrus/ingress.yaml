# Backend ingress on the Zephyrus kind cluster.
#
# Synced only by mlpipeline-backend-178 (the reunion "mlpipeline" app does not
# recurse into subdirectories). Traffic arrives from the reunion edge ingress,
# which has already done TLS, oauth2-proxy auth and the /api prefix rewrite,
# so this is plain HTTP with no auth annotations.
#
#   reunion ingress -> 192.168.1.178:80 (host nginx stream) -> this ingress
#
# /airflow goes to the webserver; everything else (/health, /predict, /docs
# after the /api rewrite) goes to serving.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlpipeline-backend
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  rules:
    - host: mlpipeline.duckdns.org
      http:
        paths:
          - path: /airflow
            pathType: Prefix
            backend:
              service:
                name: airflow-webserver
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlpipeline-serving
                port:
                  number: 8000
---
# Envoy Gateway replacement for the Ingress above (goodman_reunion #764),
# on Zephyrus' backup-gateway (NodePort 30718). It carries traffic once
# rag-forward's :18000 relay is switched from nginx's 30717 to 30718
# (Phase A of that migration). Fields the API server would default are
# written out so ArgoCD doesn't report it OutOfSync.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlpipeline-backend
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: backup-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - mlpipeline.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /airflow
      backendRefs:
        - group: ""
          kind: Service
          name: airflow-webserver
          port: 8080
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mlpipeline-serving
          port: 8000
          weight: 1
      timeouts:
        request: 0s
---
# nginx's proxy-read-timeout 3600. timeouts.request 0s (no total cap) makes
# Envoy Gateway disable the route's idle timeout, so set it explicitly.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mlpipeline-backend-idle-timeout
  namespace: mlpipeline
  labels:
    app.kubernetes.io/name: mlpipeline
    app.kubernetes.io/component: ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mlpipeline-backend
  timeout:
    http:
      streamIdleTimeout: 1h
