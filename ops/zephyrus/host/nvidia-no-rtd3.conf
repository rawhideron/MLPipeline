# Disable NVIDIA runtime D3 (fine-grained GPU power-off). The GSP firmware
# crashed resuming from it on 2026-10-13 (Xid 120 -> "GPU Reset Required"),
# and DCGM polling keeps the GPU awake in P0 anyway.
# Install to /etc/modprobe.d/, then `sudo update-initramfs -u` and reboot.
options nvidia NVreg_DynamicPowerManagement=0x00
