# ArgoCD notification triggers for MLPipeline apps.
#
# This file used to also define the mlpipeline-components ApplicationSet for
# the edge oauth2-proxy; that was retired when Envoy Gateway's native OIDC
# replaced it (rawhideron/goodman_reunion#764).
#
# Install:
#   kubectl apply -f argocd/mlpipeline-appset.yaml
---
# Notification trigger for component syncs
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  trigger.on-component-sync: |
    - when: sync_operation_status_unknown or sync_operation_failed or resource_status_unknown
      oncePer: app.status.operationState.finishedAt
      send: [app-sync-failed]
  
  trigger.on-component-health: |
    - when: app.status.health.status == 'Degraded'
      oncePer: 300s
      send: [app-health-degraded]
